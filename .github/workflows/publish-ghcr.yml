name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish, e.g. v1.4.4'
        required: true
        default: 'v1.4.4'

concurrency:
  group: ghcr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ev_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ev_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ev_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.version || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
      - name: Install verified Python dependencies
        run: |
          python -m pip install --no-deps 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.txt
          python -m pip check
      - name: Audit both dependency locks
        run: python scripts/audit_dependencies.py
      - name: Test SQLite API
        run: python -m unittest discover -s backend/tests -v
      - name: Test PostgreSQL API
        env:
          DB_TYPE: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: ev_test
          POSTGRES_USER: ev_test
          POSTGRES_PASSWORD: ci-test-only
        run: python -m unittest discover -s backend/tests -v
      - name: Frontend regression tests and build
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
          npm run build
      - name: Build fresh production image and verify runtime floors
        run: docker build --pull --no-cache -t ev-tracker:test .
      - name: Test container API and Basic Auth
        env:
          TEST_BASE_URL: http://127.0.0.1:4886
          TEST_AUTH_USERNAME: release-test
          TEST_AUTH_PASSWORD: ci-container-only
        run: |
          docker run -d --name release-test -p 127.0.0.1:4886:80 -e WEB_AUTH_ENABLED=true -e WEB_AUTH_USERNAME="$TEST_AUTH_USERNAME" -e WEB_AUTH_PASSWORD="$TEST_AUTH_PASSWORD" ev-tracker:test
          trap 'docker logs release-test; docker rm -fv release-test' EXIT
          python -m unittest discover -s backend/tests -v

  build-and-push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.version || github.sha }}
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          APP_VERSION=$(node -p "require('./frontend/package.json').version")
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$APP_VERSION"
          if [ "$EVENT_NAME" != push ]; then
            test "$TAG" = "$REQUESTED_TAG"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push versioned image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          sbom: true
          provenance: mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_BUILD_SHA=${{ steps.version.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}

      - name: Verify authenticated GHCR pull and running version
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.version.outputs.app_version }}
          EXPECTED_SHA: ${{ steps.version.outputs.sha }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' | grep -F "$EXPECTED_DIGEST"
          docker run -d --name release-smoke -p 127.0.0.1:4886:80 "$IMAGE"
          trap 'docker logs release-smoke; docker rm -fv release-smoke' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 2 --max-time 5 --retry-max-time 90 --fail http://127.0.0.1:4886/api/health
          curl --fail http://127.0.0.1:4886/api/version > /tmp/release-version.json
          python3 - <<'PY'
          import json, os
          version = json.load(open('/tmp/release-version.json'))
          assert version['version'] == os.environ['EXPECTED_VERSION'], version
          assert version['build_sha'] == os.environ['EXPECTED_SHA'], version
          print(version)
          PY
          curl --fail http://127.0.0.1:4886/ | grep 'EV Efficiency Tracker'
          echo "Verified authenticated pull: $IMAGE@$EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/release-version.json >> "$GITHUB_STEP_SUMMARY"

      - name: Promote verified image to latest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Create tag and GitHub release after verification
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes-file RELEASE_NOTES.md
