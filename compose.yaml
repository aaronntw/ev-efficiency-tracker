services:
  ev-tracker:
    image: ev-efficiency-tracker:local
    build: .
    container_name: ev-efficiency-tracker
    ports:
      - "4886:80"
    volumes:
      - ./data:/data
    environment:
      APP_VERSION: "1.4.3"
      TZ: "Asia/Kuala_Lumpur"
      DB_TYPE: "sqlite"
      SQLITE_PATH: "/data/ev_tracker.db"
      WEB_AUTH_ENABLED: "${WEB_AUTH_ENABLED:-false}"
      WEB_AUTH_USERNAME: "${WEB_AUTH_USERNAME}"	
      WEB_AUTH_PASSWORD: "${WEB_AUTH_PASSWORD}"
    restart: unless-stopped

